repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: style-guard
        name: style guard
        entry: uv run python scripts/check_style.py
        language: system
        types: [text]
        exclude: '(^|/)uv\.lock$|(^|/)package-lock\.json$|^scripts/check_style\.py$|^tests/unit/test_style_guard\.py$'
      - id: style-guard-commit-msg
        name: style guard on commit message
        entry: uv run python scripts/check_style.py
        language: system
        stages: [commit-msg]
