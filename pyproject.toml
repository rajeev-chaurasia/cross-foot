[project]
name = "crossfoot"
version = "0.1.0"
description = "Dealer statement reconciliation with per-field confidence and a human review queue"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Rajeev Chaurasia", email = "Rajeevchaurasia.dev@gmail.com" }]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-ulid>=2.7",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "img2pdf>=0.5",
    "opencv-python>=4.10",
    "augraphy>=8.2",
    "charset-normalizer>=3.3",
    "playwright>=1.45",
    "pypdf>=6.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "syrupy>=4.6",
    "hypothesis>=6.100",
]

[project.scripts]
crossfoot = "crossfoot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crossfoot"]

[tool.mypy]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "augraphy.*",
    "cv2.*",
    "img2pdf",
    "pdfplumber.*",
    "pypdfium2.*",
    "pandas.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that call real LLM providers (excluded in CI)",
]
